[platformio]
boards_dir = boards
default_envs = waveshare-p4-34c

; ---------------------------------------------------------------------------
; Waveshare ESP32-P4-WIFI6-Touch-LCD-3.4C (800x800 round DSI, JD9365 + GT911)
; Arduino core 3.x via pioarduino (official espressif32 has no ESP32-P4).
; WiFi runs on the onboard ESP32-C6 over SDIO (ESP-Hosted, EV-board pins).
; ---------------------------------------------------------------------------
[env:waveshare-p4-34c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = waveshare_esp32p4_wifi6_34c
framework = arduino
monitor_speed = 115200
; 6.5MB app slots + ~3.6MB spiffs/LittleFS (route cache) on the 32MB flash.
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<smoke/>
build_flags =
  -Wall
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  -D CORE_DEBUG_LEVEL=1
  ; Board sold as 3.4C (800x800) but the fitted panel behaves as 720x720
  ; (4C-class): center ~80px band dropped on both axes when fed 800x800.
  -D CURRENT_SCREEN=SCREEN_4INCH_DSI
  -D WM_NODEBUG
  -D WM_MDNS
  -D WEBSERVER_MAX_POST_ARGS=64
  ; P4 has no on-chip PHY (WiFi lives on the C6); WiFiManager expects this
  ; Kconfig value. 78 = 19.5 dBm, the esp32 default.
  -D CONFIG_ESP32_PHY_MAX_WIFI_TX_POWER=78
  -I include/hardware
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
  bitbank2/AnimatedGIF@^2.1.1
  bitbank2/JPEGDEC@^1.8.0

; Display + touch smoke test (src/smoke) for hardware debug.
[env:waveshare-p4-34c-smoke]
extends = env:waveshare-p4-34c
build_src_filter = -<*> +<smoke/>
lib_deps =

; ---------------------------------------------------------------------------
; LilyGO T-Encoder Pro (ESP32-S3, 390x390 AMOLED QSPI, dual panel auto-detect)
; LEGACY upstream target - not maintained in this fork. lib/Arduino_GFX was
; upgraded 1.3.7 -> 1.6.0 for the P4 port; this env may need fixes to build.
; ---------------------------------------------------------------------------
[env:tencoder-pro]
platform = espressif32@6.5.0
board = esp32s3_flash_16MB
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_dir = lib
build_src_filter = +<*> -<smoke/>
extra_scripts =
  pre:scripts/generate_icao_types.py
  pre:scripts/generate_airports.py
  pre:scripts/generate_airline_logos.py
  pre:scripts/generate_aircraft_icons.py
  post:scripts/merge_firmware.py

board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.sdkconfig_options =
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

build_flags =
  -Wall
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  -D CORE_DEBUG_LEVEL=1
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_RUNNING_CORE=1
  -D ARDUINO_EVENT_RUNNING_CORE=0
  ; Panel: auto-detect at boot (I2C touch probe, saved to NVS).
  ; Override: -D FLIGHTSCNR_PANEL_DXQ or -D FLIGHTSCNR_PANEL_TFD12
  -D WM_NODEBUG
  -D WM_MDNS
  -D WEBSERVER_MAX_POST_ARGS=64
  -I include/hardware

lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
  bitbank2/AnimatedGIF@^2.1.1
  bitbank2/JPEGDEC@^1.8.0
